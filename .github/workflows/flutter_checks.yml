name: Flutter checks

permissions: {}

on:
  pull_request:
    branches:
      - main

# Add concurrency group to cancel in-progress jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-faro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: build & test faro
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      - name: Create api-config file
        run: tool/create-api-config-file.sh

      - name: Check format
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter failures-only

  build-example-app:
    name: build Example app
    runs-on: ubuntu-latest
    needs: build-and-test-faro
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Create api-config file
        run: tool/create-api-config-file.sh

      - name: Analyze code
        working-directory: example
        run: flutter analyze

      - name: Build example app
        working-directory: example
        run: flutter build apk

      - name: Run Android unit tests
        working-directory: example/android
        run: ./gradlew :faro:testDebugUnitTest

      - name: Compile Android instrumentation tests
        working-directory: example/android
        run: ./gradlew :app:assembleDebugAndroidTest

  test-ios:
    name: build & test iOS
    runs-on: macos-latest
    needs: build-and-test-faro
    timeout-minutes: 30
    steps:
      # Checked out as `faro` because SwiftPM derives a package's identity from
      # its directory name, and the example resolves the SDK by path. From the
      # default `faro-flutter-sdk` directory the build fails to resolve. See
      # the iOS note in CONTRIBUTING.md.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: faro

      - name: Set up Flutter
        uses: ./faro/.github/actions/setup-flutter
        with:
          working-directory: faro

      - name: Install dependencies
        working-directory: faro/example
        run: flutter pub get

      - name: Create api-config file
        working-directory: faro
        run: tool/create-api-config-file.sh

      - name: Build example app
        working-directory: faro/example
        run: flutter build ios --debug --simulator

      # Resolved at runtime because the device names in the runner image change
      # whenever GitHub updates it.
      - name: Select a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator found")
          ')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        working-directory: faro/example/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}"
